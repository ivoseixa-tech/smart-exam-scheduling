name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: cccqehqyifmcnfbrpluy
      REQUIRED_MIGRATION: "20261003000100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não está disponível para este workflow."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD não está disponível para este workflow."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Check migration status before deploy
        run: supabase migration list

      - name: Preview migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Verify required migration was applied
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | grep -E "\\|[[:space:]]*$REQUIRED_MIGRATION[[:space:]]+.*\\|" || {
            echo "::error::A migration $REQUIRED_MIGRATION não foi encontrada como aplicada no Supabase remoto."
            exit 1
          }

      - name: Verify database is synchronized
        run: |
          if ! supabase db push --dry-run | grep -qiE "up to date|no changes|already applied"; then
            echo "::error::O Supabase ainda apresenta migrações pendentes após o deploy."
            exit 1
          fi
