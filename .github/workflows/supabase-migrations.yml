name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: cccqehqyifmcnfbrpluy
      REQUIRED_MIGRATION: "20261003000100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN não está disponível para este workflow."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::SUPABASE_DB_PASSWORD não está disponível para este workflow."
            exit 1
          }

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Check migration status before deploy
        run: supabase migration list --linked

      - name: Preview migrations
        run: supabase db push --dry-run --linked

      - name: Apply migrations
        run: supabase db push --linked

      - name: Verify required migration was applied remotely
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase migration list --linked)"
          printf '%s\n' "$status"
          if ! printf '%s\n' "$status" | grep -E "│[[:space:]]*$REQUIRED_MIGRATION[[:space:]]*│" >/dev/null; then
            echo "::error::A migration $REQUIRED_MIGRATION não aparece como aplicada no histórico remoto do Supabase."
            exit 1
          fi

      - name: Verify database is synchronized
        shell: bash
        run: |
          set -euo pipefail
          preview="$(supabase db push --dry-run --linked)"
          printf '%s\n' "$preview"
          if printf '%s\n' "$preview" | grep -E "$REQUIRED_MIGRATION" >/dev/null; then
            echo "::error::A migration $REQUIRED_MIGRATION ainda aparece como pendente após o deploy."
            exit 1
          fi
